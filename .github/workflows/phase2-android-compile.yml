name: Phase 2 Android compile verification
on:
  push:
    branches: [development/bilsan-v1]
    paths:
      - '.github/workflows/phase2-android-compile.yml'
      - 'apps/kids_learn/**'
      - 'apps/parent_control/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        app: [kids_learn, parent_control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate native Android project
        shell: bash
        run: |
          test -f apps/${{ matrix.app }}/android/app/build.gradle.kts
          test -f apps/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml
      - name: Fetch dependencies and run Dart tests
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compile Android debug package for verification only
        working-directory: apps/${{ matrix.app }}
        run: flutter build apk --debug
      - name: Validate local Android output (do not publish)
        working-directory: apps/${{ matrix.app }}
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          echo "Android compilation passed; no artifact uploaded, no Firebase deployment."
